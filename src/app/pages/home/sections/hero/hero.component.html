<section class="hero-section">
  <div class="blob-1"></div>
  <div class="blob-2"></div>
  <div class="blob-3"></div>

  <div class="hero-container">
    
    <div class="hero-content" data-aos="fade-up">
      <span class="eyebrow">Firma Legal en Colombia</span>
      
      <h1 class="section-title">
        CB Abogacía <br> <span class="highlight">Humana</span>
      </h1>
      
      <p class="section-desc" data-aos="fade-up">
        <strong>Solutio Justa:</strong> Justicia humana, transparente y a tu alcance para proteger lo que más valoras.
      </p>

      <div class="hero-stats" data-aos="fade-up">
        <div class="stat-item">
          <div class="stat-numero">10<span>+</span></div>
          <div class="stat-label">Años de Exp.</div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <div class="stat-numero">98<span>%</span></div>
          <div class="stat-label">Casos de Éxito</div>
        </div>
      </div>

      <div class="hero-actions" data-aos="fade-up">
        <button class="btn-primario btn-action" (click)="onClickWhatsApp()">
          <i class="fab fa-whatsapp"></i> Asesoría Inmediata
        </button>
        <a href="/#servicios" class="btn-outline btn-action">
          Ver servicios
        </a>
      </div>
    </div>

    <div class="hero-image-wrapper" data-aos="fade-up">
      <div class="image-container">
        <img ngSrc="assets/img/hero-abogados.jpg" width="800" height="600" priority alt="Equipo de Abogados CB">
        <div class="overlay"></div>
      </div>
      
      <div class="badge">
        <div class="badge-content">
          <div class="icon-box">
            <i class="fa-solid fa-scale-balanced"></i>
          </div>
          <div class="badge-text">
            <p class="label">Atención 24/7</p>
            <p class="title">Respaldo Total</p>
          </div>
        </div>
      </div>
    </div>

  </div>
</section>
