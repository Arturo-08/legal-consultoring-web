<section id="ubicacion" class="py-24 px-6 bg-fondo">
  <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
    
    <div data-aos="fade-right">
      <h2 class="text-4xl md:text-5xl font-serif text-texto mb-6">Encuéntranos en Armenia</h2>
      <p class="text-lg text-texto-medio mb-8">Nuestras oficinas están a tu disposición para atenderte personalmente o de manera virtual en todo el país.</p>
      
      <div class="space-y-6">
        <div class="flex items-start">
          <div class="w-12 h-12 rounded-full bg-fondo-alt flex items-center justify-center mr-4 shrink-0">
            <i class="fa-solid fa-location-dot text-xl text-primario"></i>
          </div>
          <div>
            <h4 class="font-bold text-texto text-xl mb-1">Dirección</h4>
            <p class="text-texto-medio">Calle 22 # 12-14, Armenia, Quindío</p>
          </div>
        </div>

        <div class="flex items-start">
          <div class="w-12 h-12 rounded-full bg-fondo-alt flex items-center justify-center mr-4 shrink-0">
            <i class="fa-solid fa-clock text-xl text-primario"></i>
          </div>
          <div>
            <h4 class="font-bold text-texto text-xl mb-1">Horarios</h4>
            <p class="text-texto-medio">Lunes a Viernes: 8:00 am - 6:00 pm<br>Sábados: 9:00 am - 1:00 pm</p>
          </div>
        </div>

        <div class="flex items-start">
          <div class="w-12 h-12 rounded-full bg-fondo-alt flex items-center justify-center mr-4 shrink-0">
            <i class="fa-solid fa-phone text-xl text-primario"></i>
          </div>
          <div>
            <h4 class="font-bold text-texto text-xl mb-1">Llámanos</h4>
            <p class="text-texto-medio">+57 321 933 7820</p>
          </div>
        </div>
      </div>

      <button class="btn-primario mt-10 w-full sm:w-auto text-center" (click)="onContactar()">
        <i class="fab fa-whatsapp mr-2"></i> Escríbenos por WhatsApp
      </button>
    </div>

    <div class="rounded-3xl overflow-hidden shadow-lg h-[400px] bg-borde" data-aos="fade-left">
      <!-- Iframe map of Armenia -->
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3977.123!2d-75.681!3d4.533!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2sCB%20Abogac%C3%ADa%20Humana!5e0!3m2!1ses!2sco"
        width="100%" height="100%" style="border:0;" allowfullscreen loading="lazy">
      </iframe>
    </div>

  </div>
</section>
