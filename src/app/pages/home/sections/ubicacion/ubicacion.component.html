<section id="ubicacion" class="ubicacion-section">
  <div class="ubicacion-container">
    
    <div class="info-wrapper" data-aos="fade-up">
      <h2 class="section-title">Encuéntranos en Armenia</h2>
      <p class="section-desc">Nuestras oficinas están a tu disposición para atenderte personalmente o de manera virtual en todo el país.</p>
      
      <div class="info-list">
        <div class="info-item">
          <div class="icon-box">
            <i class="fa-solid fa-location-dot"></i>
          </div>
          <div class="info-content">
            <h4 class="info-title">Dirección</h4>
            <p class="info-text">Cra 12 Calle 22 # 12-14, Armenia, Quindío</p>
          </div>
        </div>

        <div class="info-item">
          <div class="icon-box">
            <i class="fa-solid fa-clock"></i>
          </div>
          <div class="info-content">
            <h4 class="info-title">Horarios</h4>
            <p class="info-text">Lunes a Viernes: 8:00 am - 6:00 pm<br>Sábados: 9:00 am - 1:00 pm</p>
          </div>
        </div>

        <div class="info-item">
          <div class="icon-box">
            <i class="fa-solid fa-phone"></i>
          </div>
          <div class="info-content">
            <h4 class="info-title">Llámanos</h4>
            <p class="info-text">+57 301 235 9951</p>
          </div>
          <p class="info-text" style="align-self: center; margin: 0 2rem;"> ó </p>
          <button class="btn-primario btn-action" style="padding: 8px 16px; font-size: 0.875rem; align-self: center;" (click)="onContactar()">
            <i class="fab fa-whatsapp"></i> Escribenos
          </button>
        </div>
      </div>
    </div>

    <div class="map-wrapper" data-aos="fade-up">
      <!-- Iframe map of Armenia -->
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3977.123!2d-75.681!3d4.533!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2sCB%20Abogac%C3%ADa%20Humana!5e0!3m2!1ses!2sco"
        allowfullscreen loading="lazy">
      </iframe>
    </div>

  </div>
</section>
