<section id="equipo" class="equipo-section">
  <div class="header-container">
    <h2 class="section-title" data-aos="fade-up">Nuestro Equipo</h2>
    <p class="section-desc" data-aos="fade-up">
      Profesionales con vocación humana, listos para acompañarte y resolver tu situación legal con la mayor diligencia.
    </p>
  </div>

  <div class="equipo-grid">
    @for (abogado of equipo(); track abogado.id; let i = $index) {
      <div class="card-abogado" data-aos="fade-up" [attr.data-aos-delay]="i * 200">
        <div class="image-container">
           @if (abogado.foto) {
             <img [ngSrc]="abogado.foto" width="320" height="256" [alt]="abogado.nombre">
           } @else {
             <div class="placeholder-text">FOTO</div>
           }
        </div>
        <h3 class="abogado-name">{{ abogado.nombre }}</h3>
        <p class="abogado-especialidad">{{ abogado.especialidad }}</p>
        <button 
          class="btn-contactar"
          (click)="onContactarAbogado(abogado)"
          aria-label="Contactar abogado por WhatsApp">
          <i class="fa-brands fa-whatsapp"></i> Contactar
        </button>
      </div>
    }
  </div>
</section>
