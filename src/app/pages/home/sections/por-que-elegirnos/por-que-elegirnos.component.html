<section id="por-que-elegirnos" class="py-24 px-6 bg-fondo-alt border-y border-borde">
  <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-12 text-center">
    
    @for (razon of razones(); track razon.id; let i = $index) {
      <div class="p-8 rounded-3xl bg-fondo-card border border-borde shadow-sm transform transition duration-500 hover:scale-105" data-aos="fade-up" [attr.data-aos-delay]="i * 150">
        <div class="inline-flex items-center justify-center w-20 h-20 bg-primario/10 rounded-full mb-6">
          <i class="fa-solid text-4xl text-primario" [class]="razon.icono"></i>
        </div>
        <h3 class="text-2xl font-serif font-bold text-texto mb-4">{{ razon.titulo }}</h3>
        <p class="text-texto-medio opacity-90">{{ razon.desc }}</p>
      </div>
    }

  </div>
</section>
