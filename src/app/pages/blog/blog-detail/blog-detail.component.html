<app-navbar />

<main class="blog-detail-main">
  <div class="detail-container">
    
    @if (cargando()) {
      <div class="loading-container">
        <div class="spinner"></div>
      </div>
    } @else if (error()) {
      <div class="error-container">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <h2>{{ error() }}</h2>
        <a routerLink="/blog">Volver al blog</a>
      </div>
    } @else if (articulo()) {
      
      <article class="article-container" data-aos="fade-up">
        
        <div class="article-header">
          <div class="category-badge">
            {{ articulo()?.categoria }}
          </div>
          <h1 class="article-title">
            {{ articulo()?.titulo }}
          </h1>
          <div class="article-meta">
            <span><i class="fa-regular fa-calendar"></i> {{ articulo()?.fecha | date:'longDate':'':'es' }}</span>
            <span class="dot">•</span>
            <span><i class="fa-solid fa-scale-balanced"></i> CB Abogacía Humana</span>
          </div>
        </div>

        <div class="prose-content" [innerHTML]="contenidoHtml()">
        </div>

      </article>

      <div class="back-link" data-aos="fade-up">
        <a routerLink="/blog">
          <i class="fa-solid fa-arrow-left"></i> Volver a la lista de artículos
        </a>
      </div>

    }

  </div>
</main>

<app-footer />
